<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <script src="04_eventos_mp.js" defer></script>
<head>
<body>
    <div id="contenedor"></div>
    <button id="crear">Crear registro dietetico</button>
    <button id="eliminar">Eliminar registro</button>
    <button
        onclick="alert('Accion rapida de consulta dietetica')">
        Alerta nutricional
    </button>
    <button
        onclick="saludar()">
        Mostrar mensaje nutricional
    </button>
    <p id="parrafo">Hacer doble click para ver recomendaciones</p>

    <form id="formulario" style="margin-top: 20px;">
        <input type="text" id="nombre"
            placeholder="Nombre del paciente"
        />
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
